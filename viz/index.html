<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KMS Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d12; color: #e0e0e0; font-family: monospace; overflow: hidden; }

    #canvas { width: 100vw; height: 100vh; }

    .node circle {
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.12s;
    }
    .node:hover circle { stroke: #fff !important; stroke-width: 2.5px; }
    .node text {
      pointer-events: none;
      user-select: none;
    }

    .link {
      fill: none;
      stroke-opacity: 0.45;
      transition: stroke-opacity 0.1s, stroke-width 0.1s;
    }
    .link-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 14px;
      cursor: pointer;
    }
    .link-hit:hover ~ .link,
    .link-hit:hover + .link { stroke-opacity: 1 !important; }

    #tooltip {
      position: fixed;
      background: #16161f;
      border: 1px solid #3a3a52;
      border-radius: 7px;
      padding: 12px 15px;
      max-width: 420px;
      font-size: 12px;
      line-height: 1.65;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 20;
    }
    #tooltip .tt-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    #tooltip .tt-type {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-bottom: 7px;
      opacity: 0.85;
    }
    #tooltip .tt-desc { color: #bbb; margin-bottom: 6px; }
    #tooltip .tt-meta { color: #666; font-size: 11px; border-top: 1px solid #2a2a3a; padding-top: 6px; }
    #tooltip .tt-rel {
      margin-top: 6px;
      color: #aaa;
      font-style: italic;
      border-top: 1px solid #2a2a3a;
      padding-top: 6px;
    }
    #tooltip .tt-mechanism {
      margin-top: 8px;
      color: #c8c8d8;
      font-size: 11px;
      line-height: 1.55;
      border-top: 1px solid #2a2a3a;
      padding-top: 8px;
    }
    #tooltip .tt-mechanism-label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    #tooltip .tt-state {
      margin-top: 8px;
      color: #b8c8e8;
      font-size: 11px;
      line-height: 1.55;
      border-top: 1px solid #2a2a3a;
      padding-top: 8px;
    }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      background: #16161fcc;
      border: 1px solid #2e2e44;
      border-radius: 9px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 10;
      min-width: 190px;
    }
    #panel h2 { font-size: 14px; margin-bottom: 12px; color: #a090ff; letter-spacing: 0.04em; }
    #panel h3 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 5px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 11px; color: #ccc; }
    .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .legend-line { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    #panel .hint { margin-top: 12px; color: #444; font-size: 10px; line-height: 1.7; }

    #tag-filters {
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .tag-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 4px 0;
      font-size: 11px;
      color: #ccc;
      cursor: pointer;
      line-height: 1.35;
    }
    .tag-item input { margin-top: 2px; flex-shrink: 0; cursor: pointer; }
    .tag-item.disabled-tag { color: #666; text-decoration: line-through; }
    .tag-count { color: #555; font-size: 10px; }

    #statusbar {
      position: fixed;
      bottom: 14px;
      left: 16px;
      font-size: 11px;
      color: #444;
    }

    #agent-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: min(420px, calc(100vw - 32px));
      max-height: min(520px, calc(100vh - 32px));
      background: #16161fee;
      border: 1px solid #3a3a52;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      z-index: 30;
      font-size: 12px;
      box-shadow: 0 8px 32px #0008;
    }
    #agent-panel.collapsed #agent-body { display: none; }
    #agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #2a2a3a;
      cursor: pointer;
      user-select: none;
    }
    #agent-header h2 {
      font-size: 13px;
      color: #a090ff;
      letter-spacing: 0.04em;
      margin: 0;
    }
    #agent-toggle { color: #666; font-size: 11px; }
    #agent-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    #agent-seed {
      padding: 6px 12px;
      font-size: 10px;
      color: #666;
      border-bottom: 1px solid #222;
    }
    #agent-seed strong { color: #8a9ab8; }
    #agent-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      min-height: 180px;
      max-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      line-height: 1.55;
      padding: 8px 10px;
      border-radius: 7px;
      max-width: 95%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-user {
      align-self: flex-end;
      background: #2a2848;
      border: 1px solid #4a4580;
      color: #e8e4ff;
    }
    .msg-assistant {
      align-self: flex-start;
      background: #1a1a24;
      border: 1px solid #333348;
      color: #d0d0d8;
    }
    .msg-system {
      align-self: stretch;
      background: transparent;
      border: 1px dashed #2a2a38;
      color: #555;
      font-size: 10px;
      padding: 6px 8px;
    }
    .msg-loading { color: #888; font-style: italic; }
    #agent-form {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #2a2a3a;
    }
    #agent-input {
      flex: 1;
      background: #0d0d12;
      border: 1px solid #333348;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 12px;
      padding: 8px 10px;
      resize: none;
      min-height: 36px;
      max-height: 100px;
    }
    #agent-input:focus { outline: none; border-color: #6a5acd; }
    #agent-send {
      background: #4a4580;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      align-self: flex-end;
    }
    #agent-send:disabled { opacity: 0.45; cursor: not-allowed; }
    #agent-send:not(:disabled):hover { background: #5a5590; }

    .node.selected circle {
      stroke: #fff !important;
      stroke-width: 3px !important;
    }
  </style>
</head>
<body>

<svg id="canvas">
  <defs>
    <!-- One arrowhead marker per relationship type colour -->
  </defs>
</svg>

<div id="tooltip"></div>

<div id="panel">
  <h2>KMS Graph</h2>
  <h3>Object types</h3>
  <div id="node-legend"></div>
  <h3>Relationships</h3>
  <div id="edge-legend"></div>
  <h3>Topic tags</h3>
  <div id="tag-filters"><span style="color:#555;font-size:11px">Loading tags…</span></div>
  <div class="hint">
    scroll → zoom<br>
    drag → pan / pin node<br>
    hover → details<br>
    click node → agent seed<br>
    agent panel → chat
  </div>
</div>

<div id="statusbar">Loading…</div>

<div id="agent-panel">
  <div id="agent-header">
    <h2>Agent</h2>
    <span id="agent-toggle">−</span>
  </div>
  <div id="agent-body">
    <div id="agent-seed">Click a node to prefer it as predict seed · <span>/help</span></div>
    <div id="agent-messages">
      <div class="msg msg-assistant">Ask a question for predict mode, or type /help for commands.</div>
    </div>
    <form id="agent-form">
      <textarea id="agent-input" rows="1" placeholder="What if Iran blockades Hormuz?"></textarea>
      <button type="submit" id="agent-send">Send</button>
    </form>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── colour palettes ──────────────────────────────────────────────────────────
const NODE_COLORS = {
  person:       '#e07b6a',
  place:        '#6aace0',
  organization: '#a0d46a',
  concept:      '#c97dd4',
  event:        '#d4b06a',
  artifact:     '#6ad4c9',
  species:      '#82d48a',
  process:      '#d4826a',
  market:       '#f0d060',
  instrument:   '#60d0a0',
  other:        '#8888aa',
};
const DEFAULT_NODE_COLOR = '#8888aa';

const EDGE_COLORS = {
  INFLUENCES: '#e0a030',
  DEPENDS_ON: '#e05050',
  CONTROLS:   '#c040c0',
  REPRESENTS: '#40b0e0',
  CONTAINS:   '#50c080',
  PREDICTS:   '#f0a030',
};
const DEFAULT_EDGE_COLOR = '#555577';

function escapeHtml(text) {
  return String(text ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function nodeColor(d) { return NODE_COLORS[d.object_type] ?? DEFAULT_NODE_COLOR; }
function edgeColor(e) { return EDGE_COLORS[e.relationship_type] ?? DEFAULT_EDGE_COLOR; }

// ── SVG setup ────────────────────────────────────────────────────────────────
const svg = d3.select('#canvas');
const width  = window.innerWidth;
const height = window.innerHeight;
svg.attr('viewBox', [0, 0, width, height]);

const defs = svg.select('defs');
const g = svg.append('g');

svg.call(
  d3.zoom().scaleExtent([0.1, 6])
    .on('zoom', e => g.attr('transform', e.transform))
);

const tooltip  = document.getElementById('tooltip');
const statusEl = document.getElementById('statusbar');

// ── agent chat ───────────────────────────────────────────────────────────────
let selectedNode = null;
let chatBusy = false;
const agentPanel = document.getElementById('agent-panel');
const agentMessages = document.getElementById('agent-messages');
const agentInput = document.getElementById('agent-input');
const agentSend = document.getElementById('agent-send');
const agentSeed = document.getElementById('agent-seed');
const agentToggle = document.getElementById('agent-toggle');

document.getElementById('agent-header').addEventListener('click', ev => {
  if (ev.target.closest('#agent-form')) return;
  agentPanel.classList.toggle('collapsed');
  agentToggle.textContent = agentPanel.classList.contains('collapsed') ? '+' : '−';
});

function updateSeedHint() {
  if (selectedNode) {
    agentSeed.innerHTML = `Seed: <strong>${escapeHtml(selectedNode.label)}</strong> · click node again to clear`;
  } else {
    agentSeed.innerHTML = 'Click a node to prefer it as predict seed · <span>/help</span>';
  }
}

function appendMessage(text, role) {
  const el = document.createElement('div');
  el.className = 'msg msg-' + role;
  el.textContent = text;
  agentMessages.appendChild(el);
  agentMessages.scrollTop = agentMessages.scrollHeight;
  return el;
}

function appendSystemLog(lines) {
  if (!lines || !lines.length) return;
  const el = document.createElement('div');
  el.className = 'msg msg-system';
  el.textContent = lines.join('\n');
  agentMessages.appendChild(el);
  agentMessages.scrollTop = agentMessages.scrollHeight;
}

async function sendChatMessage(text) {
  if (chatBusy || !text.trim()) return;
  chatBusy = true;
  agentSend.disabled = true;
  appendMessage(text.trim(), 'user');
  agentInput.value = '';
  const loading = appendMessage('Thinking…', 'loading');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text.trim(),
        selected_node_uuid: selectedNode?.uuid || null,
      }),
    });
    loading.remove();
    if (!res.ok) {
      const err = await res.text();
      appendMessage('Error: ' + err, 'assistant');
      return;
    }
    const data = await res.json();
    appendSystemLog(data.logs);
    appendMessage(data.reply || '(no reply)', 'assistant');
    if (data.graph_updated) {
      lastRaw = null;
      loadTags();
      loadAndRender();
    }
  } catch (err) {
    loading.remove();
    appendMessage('Request failed: ' + err.message, 'assistant');
  } finally {
    chatBusy = false;
    agentSend.disabled = false;
    agentInput.focus();
  }
}

document.getElementById('agent-form').addEventListener('submit', ev => {
  ev.preventDefault();
  sendChatMessage(agentInput.value);
});

agentInput.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    sendChatMessage(agentInput.value);
  }
});

// ── arrowhead markers ─────────────────────────────────────────────────────────
function ensureMarker(id, color) {
  if (defs.select(`#${id}`).empty()) {
    defs.append('marker')
      .attr('id', id)
      .attr('viewBox', '0 -4 8 8')
      .attr('refX', 18)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
        .attr('d', 'M0,-4L8,0L0,4')
        .attr('fill', color);
  }
}

// ── legend ────────────────────────────────────────────────────────────────────
const nodeLegEl = document.getElementById('node-legend');
Object.entries(NODE_COLORS).forEach(([type, color]) => {
  nodeLegEl.innerHTML += `
    <div class="legend-item">
      <div class="legend-dot" style="background:${color}"></div>${type}
    </div>`;
});

const edgeLegEl = document.getElementById('edge-legend');
Object.entries(EDGE_COLORS).forEach(([type, color]) => {
  edgeLegEl.innerHTML += `
    <div class="legend-item">
      <div class="legend-line" style="background:${color}"></div>${type}
    </div>`;
});

// ── live reload ───────────────────────────────────────────────────────────────
let lastRaw = null;
let lastGraphData = null;
let currentSim = null;
let disabledTags = new Set();
let tagSummary = [];

function normalizeTag(tag) {
  return (tag || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function isNodeHidden(node) {
  const tags = node.tags || [];
  return tags.some(t => disabledTags.has(normalizeTag(t)));
}

async function loadTags() {
  try {
    const res = await fetch('/api/tags?' + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    tagSummary = data.tags || [];
    disabledTags = new Set(data.disabled_tags || []);
    renderTagPanel();
    refreshGraphView();
  } catch (_) {}
}

function renderTagPanel() {
  const el = document.getElementById('tag-filters');
  if (!tagSummary.length) {
    el.innerHTML = '<span style="color:#555;font-size:11px">No tags yet</span>';
    return;
  }
  el.innerHTML = tagSummary.map(({ tag, count, disabled }) => `
    <label class="tag-item${disabled ? ' disabled-tag' : ''}">
      <input type="checkbox" data-tag="${escapeHtml(tag)}" ${disabled ? '' : 'checked'} />
      <span>${escapeHtml(tag)} <span class="tag-count">(${count})</span></span>
    </label>
  `).join('');

  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const tag = cb.dataset.tag;
      if (cb.checked) disabledTags.delete(tag);
      else disabledTags.add(tag);
      refreshGraphView();
      await persistDisabledTags();
    });
  });
}

async function persistDisabledTags() {
  try {
    const res = await fetch('/api/disabled-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disabled_tags: [...disabledTags] }),
    });
    if (!res.ok) {
      statusEl.textContent = `Tag save failed (${res.status}) — use python viz/server.py`;
      return;
    }
    await loadTags();
  } catch (_) {
    statusEl.textContent = 'Tag save failed — use python viz/server.py';
  }
}

function refreshGraphView() {
  if (!lastGraphData) return;
  if (currentSim) currentSim.stop();
  g.selectAll('*').remove();
  render(lastGraphData);
}

function loadAndRender() {
  fetch('graph.json?' + Date.now())
    .then(r => r.text())
    .then(raw => {
      if (raw === lastRaw) return;
      lastRaw = raw;
      lastGraphData = JSON.parse(raw);
      refreshGraphView();
    })
    .catch(() => {});
}

setInterval(loadAndRender, 2000);
setInterval(loadTags, 5000);
loadTags();
loadAndRender();

// ── render ────────────────────────────────────────────────────────────────────
function render({ nodes, edges }) {
  const visibleNodes = nodes.filter(n => !isNodeHidden(n));
  const visibleIds = new Set(visibleNodes.map(n => n.uuid));
  const visibleEdges = edges.filter(
    e => visibleIds.has(e.source) && visibleIds.has(e.target)
  );
  const hiddenCount = nodes.length - visibleNodes.length;

  statusEl.textContent =
    `${visibleNodes.length} objects · ${visibleEdges.length} edges · live` +
    (hiddenCount ? ` · ${hiddenCount} hidden (disabled)` : '');

  if (!visibleNodes.length) return;

  nodes = visibleNodes;
  edges = visibleEdges;

  // Ensure arrowhead markers exist for all edge colours
  const seenColors = new Set();
  edges.forEach(e => {
    const c = edgeColor(e);
    const mid = 'arr-' + (e.relationship_type || 'default').replace(/[^a-zA-Z0-9]/g, '_');
    if (!seenColors.has(mid)) { ensureMarker(mid, c); seenColors.add(mid); }
    e._marker = mid;
  });
  ensureMarker('arr-default', DEFAULT_EDGE_COLOR);

  const nodeById = new Map(nodes.map(n => [n.uuid, n]));

  const links = edges.map(e => ({
    ...e,
    source: e.source,
    target: e.target,
  }));

  // Initial positions — spread in a circle
  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * 2 * Math.PI;
    const r = Math.min(width, height) * 0.35;
    n.x = width  / 2 + r * Math.cos(angle);
    n.y = height / 2 + r * Math.sin(angle);
  });

  // ── force simulation ────────────────────────────────────────────────────────
  currentSim = d3.forceSimulation(nodes)
    .force('link',   d3.forceLink(links).id(d => d.uuid).distance(180).strength(0.25))
    .force('charge', d3.forceManyBody().strength(-500))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide(28));

  const sim = currentSim;

  // ── edges ───────────────────────────────────────────────────────────────────
  const edgeG = g.append('g');

  // Visible path
  const linkEl = edgeG.selectAll('path.link')
    .data(links).join('path')
    .attr('class', 'link')
    .attr('stroke', e => edgeColor(e))
    .attr('stroke-width', 1.8)
    .attr('marker-end', e => `url(#${e._marker})`);

  // Wide invisible hit area
  const linkHit = edgeG.selectAll('path.link-hit')
    .data(links).join('path')
    .attr('class', 'link-hit')
    .on('mousemove', (ev, d) => {
      linkEl.attr('stroke-opacity', l => l === d ? 1 : 0.1);
      const src = nodeById.get(d.source.uuid ?? d.source);
      const tgt = nodeById.get(d.target.uuid ?? d.target);
      const rtype = d.relationship_type || '';
      const rcolor = EDGE_COLORS[rtype] ?? DEFAULT_EDGE_COLOR;
      const mechanism = d.mechanism
        ? `<div class="tt-mechanism"><span class="tt-mechanism-label">Mechanism</span>${escapeHtml(d.mechanism)}</div>`
        : '';
      showTooltip(ev, `
        <div class="tt-title" style="color:${rcolor}">${rtype || 'Edge'}</div>
        <div class="tt-desc">${escapeHtml(d.relationship)}</div>
        <div class="tt-meta">
          <strong>${escapeHtml(src?.label ?? '?')}</strong> → <strong>${escapeHtml(tgt?.label ?? '?')}</strong>
          <br>weight: ${d.weight}
        </div>
        ${mechanism}
      `);
    })
    .on('mouseleave', () => {
      linkEl.attr('stroke-opacity', 0.45);
      hideTooltip();
    });

  // ── nodes ───────────────────────────────────────────────────────────────────
  const nodeG = g.append('g').selectAll('g.node')
    .data(nodes).join('g')
    .attr('class', 'node');

  let dragMoved = false;
  nodeG.call(
    d3.drag()
      .on('start', (ev, d) => {
        dragMoved = false;
        if (!ev.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (ev, d) => {
        dragMoved = true;
        d.fx = ev.x; d.fy = ev.y;
      })
      .on('end', (ev, d) => {
        if (!ev.active) sim.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
  );

  const nodeRadius = d => {
    const base = 8;
    return base + Math.min(Math.sqrt(d.chunk_count ?? 1) * 2, 12);
  };

  nodeG.append('circle')
    .attr('r', nodeRadius)
    .attr('fill', nodeColor)
    .attr('stroke', d => d3.color(nodeColor(d)).brighter(0.7));

  nodeG.append('text')
    .attr('dy', d => nodeRadius(d) + 11)
    .attr('text-anchor', 'middle')
    .attr('font-size', 10)
    .attr('fill', '#bbb')
    .text(d => d.label.length > 22 ? d.label.slice(0, 20) + '…' : d.label);

  nodeG.on('mousemove', (ev, d) => {
    const color = nodeColor(d);
    const chunks = d.chunk_count ?? 0;
    const stateBlock = d.state
      ? `<div class="tt-state"><span class="tt-mechanism-label">Current State</span>${escapeHtml(d.state)}</div>`
      : '';
    const tags = (d.tags || []).filter(Boolean);
    const tagBlock = tags.length
      ? `<div class="tt-meta" style="border-top:none;padding-top:0;margin-top:6px">tags: ${tags.map(t => escapeHtml(t)).join(', ')}</div>`
      : '';
    showTooltip(ev, `
      <div class="tt-title" style="color:${color}">${escapeHtml(d.label)}</div>
      <div class="tt-type" style="background:${color}22; color:${color}">${escapeHtml(d.object_type)}</div>
      ${d.description ? `<div class="tt-desc">${escapeHtml(d.description)}</div>` : ''}
      ${stateBlock}
      ${tagBlock}
      <div class="tt-meta">${chunks} chunk reference${chunks !== 1 ? 's' : ''}</div>
    `);
  }).on('mouseleave', hideTooltip);

  nodeG.on('click', (ev, d) => {
    if (dragMoved) return;
    ev.stopPropagation();
    if (selectedNode && selectedNode.uuid === d.uuid) {
      selectedNode = null;
    } else {
      selectedNode = { uuid: d.uuid, label: d.label };
    }
    nodeG.classed('selected', n => selectedNode && n.uuid === selectedNode.uuid);
    updateSeedHint();
  });

  if (selectedNode) {
    nodeG.classed('selected', n => n.uuid === selectedNode.uuid);
  }

  // ── tick ────────────────────────────────────────────────────────────────────
  sim.on('tick', () => {
    // Curved path for each directed edge
    linkEl.attr('d', arcPath);
    linkHit.attr('d', arcPath);
    nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// Slightly curved arc so bidirectional edges don't fully overlap
function arcPath(d) {
  const sx = d.source.x, sy = d.source.y;
  const tx = d.target.x, ty = d.target.y;
  const dx = tx - sx, dy = ty - sy;
  const dr = Math.sqrt(dx * dx + dy * dy) * 1.6;
  return `M${sx},${sy}A${dr},${dr} 0 0,1 ${tx},${ty}`;
}

// ── tooltip helpers ───────────────────────────────────────────────────────────
function showTooltip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  positionTooltip(ev);
}
function hideTooltip() { tooltip.style.opacity = '0'; }
function positionTooltip(ev) {
  const pad = 18;
  let x = ev.clientX + pad;
  let y = ev.clientY - 10;
  if (x + 440 > window.innerWidth)  x = ev.clientX - 440 - pad;
  if (y + 280 > window.innerHeight) y = window.innerHeight - 290;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
document.addEventListener('mousemove', ev => {
  if (tooltip.style.opacity !== '0') positionTooltip(ev);
});
</script>
